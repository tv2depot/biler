<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fejlmelding — TV 2 Depot</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --red: #CC0000;
  --red-dark: #990000;
  --red-light: #fff0f0;
  --green: #2a8a4a;
  --green-light: #e6f4ec;
  --orange: #d47c00;
  --orange-light: #fff4e0;
  --blue: #1a6fc4;
  --blue-light: #e8f1fb;
  --gray: #6b7280;
  --gray-light: #f4f4f2;
  --gray-border: #e2e1dc;
  --text: #1a1a18;
  --text-muted: #6b7280;
  --bg: #f7f6f2;
  --bg-card: #ffffff;
  --font: 'DM Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --radius: 10px;
  --radius-lg: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: 40px;
}

/* ── HEADER ── */
.header {
  background: var(--red);
  color: white;
  padding: 20px 20px 24px;
  position: relative;
  overflow: hidden;
}
.header::after {
  content: '';
  position: absolute;
  bottom: -20px; left: -10px; right: -10px;
  height: 40px;
  background: var(--bg);
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
}
.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.logo-circle {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.logo-circle svg { width: 20px; height: 20px; }
.header-brand { font-size: 13px; font-weight: 600; opacity: 0.9; }
.header-sub { font-size: 11px; opacity: 0.7; }

.car-badge {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: var(--radius);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.car-badge-icon { font-size: 22px; }
.car-badge-id {
  font-size: 22px;
  font-weight: 700;
  font-family: var(--font-mono);
  letter-spacing: 0.03em;
}
.car-badge-label { font-size: 11px; opacity: 0.75; }

/* ── CONTENT ── */
.content { padding: 28px 16px 0; }

/* ── AKTIVE FEJL ── */
.section-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
}

.active-faults { margin-bottom: 24px; }

.fault-card {
  background: var(--bg-card);
  border: 1px solid var(--gray-border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.fault-card.service { border-left: 3px solid var(--orange); }
.fault-card.stenslag { border-left: 3px solid var(--red); }
.fault-card.daektryk { border-left: 3px solid var(--blue); }
.fault-card.andet { border-left: 3px solid var(--gray); }

.fault-icon { font-size: 18px; margin-top: 1px; }
.fault-body { flex: 1; min-width: 0; }
.fault-category { font-size: 13px; font-weight: 600; }
.fault-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.fault-time { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 4px; }

.no-faults {
  background: var(--green-light);
  border: 1px solid #c3e8d0;
  border-radius: var(--radius);
  padding: 12px 14px;
  font-size: 13px;
  color: var(--green);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ── FORM CARD ── */
.form-card {
  background: var(--bg-card);
  border: 1px solid var(--gray-border);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 20px;
}

.form-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
  color: var(--text);
}

/* ── KATEGORI KNAPPER ── */
.cat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.cat-btn {
  background: var(--gray-light);
  border: 2px solid transparent;
  border-radius: var(--radius);
  padding: 14px 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  -webkit-user-select: none;
  user-select: none;
}
.cat-btn:active { transform: scale(0.97); }
.cat-btn.selected {
  background: var(--red-light);
  border-color: var(--red);
}
.cat-btn.selected.service { background: var(--orange-light); border-color: var(--orange); }
.cat-btn.selected.stenslag { background: var(--red-light); border-color: var(--red); }
.cat-btn.selected.daektryk { background: var(--blue-light); border-color: var(--blue); }
.cat-btn.selected.andet { background: var(--gray-light); border-color: var(--gray); }

.cat-icon { font-size: 24px; margin-bottom: 6px; display: block; }
.cat-label { font-size: 13px; font-weight: 600; color: var(--text); }
.cat-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* ── TEXTAREA ── */
.fritekst-wrap {
  display: none;
  margin-bottom: 16px;
}
.fritekst-wrap.show { display: block; }

textarea {
  width: 100%;
  border: 1px solid var(--gray-border);
  border-radius: var(--radius);
  padding: 12px;
  font-family: var(--font);
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
  resize: none;
  min-height: 90px;
  outline: none;
  transition: border-color 0.15s;
}
textarea:focus { border-color: var(--red); }
.char-count { font-size: 11px; color: var(--text-muted); text-align: right; margin-top: 4px; }

/* ── SUBMIT ── */
.submit-btn {
  width: 100%;
  background: var(--red);
  color: white;
  border: none;
  border-radius: var(--radius);
  padding: 16px;
  font-family: var(--font);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.submit-btn:active { transform: scale(0.98); background: var(--red-dark); }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ── SUCCESS / ERROR ── */
.result-msg {
  display: none;
  border-radius: var(--radius);
  padding: 14px;
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  margin-top: 12px;
}
.result-msg.success {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--green-light);
  color: var(--green);
  border: 1px solid #c3e8d0;
}
.result-msg.error {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--red-light);
  color: var(--red);
  border: 1px solid #f5c0c0;
}

/* ── LOADING ── */
.loading { text-align: center; padding: 16px; color: var(--text-muted); font-size: 13px; }
.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid var(--gray-border);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── CONFIG OVERLAY ── */
.config-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.config-overlay.show { display: flex; }
.config-box {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 24px;
  width: 100%;
  max-width: 400px;
}
.config-box h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.config-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
.config-box label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; }
.config-box input {
  width: 100%;
  border: 1px solid var(--gray-border);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-size: 14px;
  font-family: var(--font-mono);
  outline: none;
  margin-bottom: 12px;
}
.config-box input:focus { border-color: var(--red); }
.config-save {
  width: 100%;
  background: var(--red);
  color: white;
  border: none;
  border-radius: var(--radius);
  padding: 12px;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

/* ── FOOTER SETTINGS LINK ── */
.settings-link {
  text-align: center;
  margin-top: 16px;
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}
</style>
</head>
<body>

<!-- ── HEADER ── -->
<div class="header">
  <div class="header-top">
    <div class="logo-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 5v4h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
      </svg>
    </div>
    <div>
      <div class="header-brand">TV 2 Danmark</div>
      <div class="header-sub">Bilflåde — Depotservice</div>
    </div>
  </div>
  <div class="car-badge">
    <div class="car-badge-icon">🚗</div>
    <div>
      <div class="car-badge-id" id="car-id-display">—</div>
      <div class="car-badge-label">Nuværende køretøj</div>
    </div>
  </div>
</div>

<!-- ── CONTENT ── -->
<div class="content">

  <!-- AKTIVE FEJL PÅ DENNE BIL -->
  <div class="active-faults">
    <div class="section-title">Aktive fejlmeldinger på denne bil</div>
    <div id="active-faults-list">
      <div class="loading"><span class="spinner"></span>Henter fejlmeldinger…</div>
    </div>
  </div>

  <!-- FORMULAR -->
  <div class="form-card">
    <div class="form-title">📋 Ny fejlmelding</div>

    <div class="cat-grid">
      <div class="cat-btn service" onclick="selectCategory('service', this)">
        <span class="cat-icon">🔧</span>
        <div class="cat-label">Service</div>
        <div class="cat-sub">Vedligehold</div>
      </div>
      <div class="cat-btn stenslag" onclick="selectCategory('stenslag', this)">
        <span class="cat-icon">💥</span>
        <div class="cat-label">Stenslag</div>
        <div class="cat-sub">Rude/lak</div>
      </div>
      <div class="cat-btn daektryk" onclick="selectCategory('daektryk', this)">
        <span class="cat-icon">🔴</span>
        <div class="cat-label">Dæktryk</div>
        <div class="cat-sub">TPMS-advarsel</div>
      </div>
      <div class="cat-btn andet" onclick="selectCategory('andet', this)">
        <span class="cat-icon">📝</span>
        <div class="cat-label">Andet</div>
        <div class="cat-sub">Fritekst</div>
      </div>
    </div>

    <div class="fritekst-wrap" id="fritekst-wrap">
      <textarea id="fritekst" placeholder="Beskriv fejlen kort…" maxlength="300" oninput="updateCharCount()"></textarea>
      <div class="char-count"><span id="char-count">0</span>/300</div>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitFault()" disabled>
      ⚡ Send fejlmelding
    </button>
    <div class="result-msg" id="result-msg"></div>
  </div>

</div>

<script>
// ─── KONFIGURATION (hardcodet) ────────────────────────────────────────────────
const CFG = {
  formUrl:    'https://docs.google.com/forms/d/e/1FAIpQLSfxhwFJVPvHbYovZ3koGf-bCTFFRGUUS54ZJ9B71LuH3Dj4fA/formResponse',
  entryCarId: 'entry.380708390',
  entryCatId: 'entry.306348509',
  entryDescId:'entry.540856135',
  sheetId:    '16pClSqAXH0z22bSvqrll5FNLhw9NiHudU4HBCk0J41c',
  apiKey:     'AIzaSyBnntcgnLNxS4nXq1xW-nbn619ImEXeDhg',
  sheetName:  'Formularsvar 1',
};

function loadConfig() { return CFG; }

// ─── BIL FRA URL ─────────────────────────────────────────────────────────────
const urlParams = new URLSearchParams(window.location.search);
const bilId = (urlParams.get('bil') || '').toUpperCase().trim();

document.getElementById('car-id-display').textContent = bilId || '???';
if (!bilId) {
  document.getElementById('car-id-display').style.color = 'rgba(255,255,255,0.4)';
}

// ─── KATEGORI VALG ────────────────────────────────────────────────────────────
let selectedCategory = null;

function selectCategory(cat, el) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selectedCategory = cat;
  document.getElementById('fritekst-wrap').classList.toggle('show', cat === 'andet');
  updateSubmitBtn();
}

function updateSubmitBtn() {
  const btn = document.getElementById('submit-btn');
  btn.disabled = !selectedCategory || !bilId;
}

function updateCharCount() {
  const v = document.getElementById('fritekst').value.length;
  document.getElementById('char-count').textContent = v;
}

// ─── AKTIVE FEJLMELDINGER ─────────────────────────────────────────────────────
const CAT_META = {
  'Service':   { icon: '🔧', cls: 'service' },
  'Stenslag':  { icon: '💥', cls: 'stenslag' },
  'Dæktryk':   { icon: '🔴', cls: 'daektryk' },
  'Andet':     { icon: '📝', cls: 'andet' },
};

function catKey(cat) {
  // Normaliser til dansk visningsnavn
  const m = { service: 'Service', stenslag: 'Stenslag', daektryk: 'Dæktryk', andet: 'Andet' };
  return m[cat] || cat;
}

function fmtTimestamp(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return ts;
  return d.toLocaleDateString('da-DK', { day:'2-digit', month:'short' }) + ' ' +
         d.toLocaleTimeString('da-DK', { hour:'2-digit', minute:'2-digit' });
}

async function loadActiveFaults() {
  const el = document.getElementById('active-faults-list');
  if (!bilId) {
    el.innerHTML = '<div class="no-faults">⚠️ Ingen bil-ID i URL (brug ?bil=ENG103)</div>';
    return;
  }
  const cfg = loadConfig();
  if (!cfg.sheetId || !cfg.apiKey) {
    el.innerHTML = '<div class="no-faults">ℹ️ Konfigurer Google Sheets nedenfor for at vise fejlmeldinger.</div>';
    return;
  }

  el.innerHTML = '<div class="loading"><span class="spinner"></span>Henter fejlmeldinger…</div>';

  try {
    // Kolonnerækkefølge: A=Tidsstempel | B=Mailadresse | C=Bil | D=Kategori | E=Beskrivelse | F=Status
    const sheetName = encodeURIComponent(cfg.sheetName || 'Formularsvar 1');
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${cfg.sheetId}/values/${sheetName}?key=${cfg.apiKey}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    const rows = (data.values || []).slice(1); // skip header
    const mine = rows.filter(r => (r[2]||'').toUpperCase().trim() === bilId && (r[5]||'').toLowerCase() !== 'kvitteret');

    if (!mine.length) {
      el.innerHTML = '<div class="no-faults">✅ Ingen aktive fejlmeldinger på denne bil</div>';
      return;
    }

    el.innerHTML = mine.map(r => {
      const ts   = r[0] || '';
      const cat  = r[3] || '';
      const desc = r[4] || '';
      const meta = CAT_META[cat] || { icon: '❓', cls: '' };
      return `
        <div class="fault-card ${meta.cls}">
          <div class="fault-icon">${meta.icon}</div>
          <div class="fault-body">
            <div class="fault-category">${cat}</div>
            ${desc ? `<div class="fault-desc">${desc}</div>` : ''}
            <div class="fault-time">${fmtTimestamp(ts)}</div>
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    el.innerHTML = `<div class="no-faults" style="background:var(--red-light);color:var(--red);border-color:#f5c0c0;">⚠️ Kunne ikke hente fejlmeldinger (${e.message})</div>`;
  }
}

// ─── INDSEND FEJLMELDING ──────────────────────────────────────────────────────
async function submitFault() {
  if (!selectedCategory || !bilId) return;
  const cfg = loadConfig();
  const fritekst = document.getElementById('fritekst').value.trim();
  if (selectedCategory === 'andet' && !fritekst) {
    document.getElementById('fritekst').focus();
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Sender…';

  // Google Forms indsend via no-cors (returnerer altid opaque response)
  const formData = new FormData();
  formData.append(cfg.entryCarId, bilId);
  formData.append(cfg.entryCatId, catKey(selectedCategory));
  if (cfg.entryDescId) formData.append(cfg.entryDescId, fritekst);

  try {
    await fetch(cfg.formUrl, { method: 'POST', mode: 'no-cors', body: formData });
    // no-cors giver ingen fejl ved success
    showResult('success', '✅ Fejlmelding sendt til depotpersonalet');
    // Reset
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('fritekst').value = '';
    document.getElementById('fritekst-wrap').classList.remove('show');
    document.getElementById('char-count').textContent = '0';
    selectedCategory = null;
    setTimeout(loadActiveFaults, 3000); // Genlæs efter 3s
  } catch(e) {
    showResult('error', '⚠️ Netværksfejl — prøv igen');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '⚡ Send fejlmelding';
    updateSubmitBtn();
  }
}

function showResult(type, msg) {
  const el = document.getElementById('result-msg');
  el.className = 'result-msg ' + type;
  el.textContent = msg;
  setTimeout(() => { el.className = 'result-msg'; }, 5000);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
updateSubmitBtn();
loadActiveFaults();
</script>
</body>
</html>
